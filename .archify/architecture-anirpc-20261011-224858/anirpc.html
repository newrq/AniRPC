<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AniRPC — архитектура</title>
<style>
  :root { --bg: #0d0f12; --card: #16181d; --line: #2a2e38; --text: #eef0f6;
    --muted: #a2a8b8; --accent: #f4a6be; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 28px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h1 .dot { color: var(--accent); }
  p.sub { color: var(--muted); margin: 0 0 20px; max-width: 900px; text-align: center; }
  figure { margin: 0; width: 100%; max-width: 1040px; background: var(--card);
    border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
  svg { width: 100%; height: auto; display: block; }
  .node rect { fill: #1e2128; stroke: var(--line); stroke-width: 1.5; rx: 10; transition: stroke .2s; }
  .node:hover rect { stroke: var(--accent); }
  .node text { fill: var(--text); font-size: 13px; font-weight: 600; }
  .node .small { fill: var(--muted); font-size: 11px; font-weight: 400; }
  .zone { fill: none; stroke: var(--line); stroke-dasharray: 6 5; rx: 12; }
  .zone-label { fill: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 1px; }
  .edge { stroke: var(--accent); stroke-width: 1.8; fill: none; opacity: .85; }
  .edge-lbl { fill: var(--accent); font-size: 11px; paint-order: stroke; stroke: #16181d; stroke-width: 4px; }
  .edge-dim { stroke: #5a6070; }
  .edge-dim-lbl { fill: var(--muted); font-size: 11px; paint-order: stroke; stroke: #16181d; stroke-width: 4px; }
  figcaption { color: var(--muted); font-size: 12.5px; margin-top: 12px; text-align: center; }
  figcaption code { color: var(--accent); }
</style>
</head>
<body>
<h1>AniRPC <span class="dot">●</span> архитектура</h1>
<p class="sub">Discord Rich Presence для 4 аниме-сайтов: расширение MV3 собирает данные из DOM, локальный мост публикует их в Discord (напрямую из расширения к IPC Discord доступа нет).</p>
<figure>
<svg viewBox="0 0 1000 640" role="img" aria-label="Архитектура AniRPC: сайты, расширение, мост, Discord">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4a6be"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6070"/>
    </marker>
  </defs>

  <!-- зоны -->
  <rect class="zone" x="16" y="56" width="196" height="500"/>
  <text class="zone-label" x="32" y="82">САЙТЫ (WEB)</text>
  <rect class="zone" x="232" y="56" width="324" height="500"/>
  <text class="zone-label" x="248" y="82">РАСШИРЕНИЕ · CHROME MV3</text>
  <rect class="zone" x="570" y="56" width="190" height="500"/>
  <text class="zone-label" x="586" y="82">LOCALHOST</text>
  <rect class="zone" x="780" y="56" width="204" height="500"/>
  <text class="zone-label" x="796" y="82">DISCORD</text>

  <!-- сайты -->
  <g class="node"><title>ru.yummyani.me</title>
    <rect x="30" y="120" width="168" height="56" rx="10"/><text x="114" y="143" text-anchor="middle">ru.yummyani.me</text><text class="small" x="114" y="161" text-anchor="middle">DOM + &lt;video&gt;</text></g>
  <g class="node"><title>yummyanime.tv</title>
    <rect x="30" y="192" width="168" height="56" rx="10"/><text x="114" y="215" text-anchor="middle">yummyanime.tv</text><text class="small" x="114" y="233" text-anchor="middle">DOM + &lt;video&gt;</text></g>
  <g class="node"><title>animego.me</title>
    <rect x="30" y="264" width="168" height="56" rx="10"/><text x="114" y="287" text-anchor="middle">animego.me</text><text class="small" x="114" y="305" text-anchor="middle">DOM + &lt;video&gt;</text></g>
  <g class="node"><title>jut.su</title>
    <rect x="30" y="336" width="168" height="56" rx="10"/><text x="114" y="359" text-anchor="middle">jut.su</text><text class="small" x="114" y="377" text-anchor="middle">DOM + &lt;video&gt;</text></g>

  <!-- расширение -->
  <g class="node"><title>content.js — парсинг title/серии/постера/времени</title>
    <rect x="248" y="200" width="270" height="72" rx="10"/><text x="383" y="228" text-anchor="middle">content.js</text><text class="small" x="383" y="248" text-anchor="middle">title · сезон · эпизод · постер · время</text></g>
  <g class="node"><title>background.js — WebSocket-клиент моста, шаблоны, дедуп</title>
    <rect x="248" y="300" width="270" height="72" rx="10"/><text x="383" y="328" text-anchor="middle">background.js</text><text class="small" x="383" y="348" text-anchor="middle">service worker · WS-клиент · дедуп</text></g>
  <g class="node"><title>popup — статус, сейчас играет, тумблер, сайты</title>
    <rect x="248" y="396" width="270" height="72" rx="10"/><text x="383" y="424" text-anchor="middle">popup</text><text class="small" x="383" y="444" text-anchor="middle">статус · сейчас играет · сайты</text></g>
  <g class="node"><title>chrome.storage.local — enabled, sites</title>
    <rect x="248" y="492" width="270" height="52" rx="10"/><text x="383" y="513" text-anchor="middle">storage.local</text><text class="small" x="383" y="530" text-anchor="middle">enabled · sites</text></g>

  <!-- мост -->
  <g class="node"><title>bridge/server.js — WS-сервер + discord-rpc</title>
    <rect x="586" y="296" width="158" height="72" rx="10"/><text x="665" y="324" text-anchor="middle">bridge</text><text class="small" x="665" y="344" text-anchor="middle">server.js · ws + rpc</text></g>

  <!-- discord -->
  <g class="node"><title>Discord client — Rich Presence</title>
    <rect x="796" y="296" width="172" height="72" rx="10"/><text x="882" y="324" text-anchor="middle">Discord</text><text class="small" x="882" y="344" text-anchor="middle">Rich Presence</text></g>
  <g class="node"><title>Карточка статуса: название, серия, таймлайн, постер</title>
    <rect x="796" y="388" width="172" height="88" rx="10"/><text x="882" y="412" text-anchor="middle">статус</text><text class="small" x="882" y="430" text-anchor="middle">название · серия</text><text class="small" x="882" y="446" text-anchor="middle">таймлайн · постер</text></g>

  <!-- рёбра: сайты -> content через общий коллектор -->
  <path class="edge-dim" d="M198,148 L224,148 M198,220 L224,220 M198,292 L224,292 M198,364 L224,364 M224,148 L224,364"/>
  <path class="edge" d="M224,240 L248,240" marker-end="url(#arr)"/>
  <text class="edge-lbl" x="223" y="108" text-anchor="middle">парсинг DOM</text>

  <!-- content -> background -->
  <path class="edge" d="M383,272 L383,300" marker-end="url(#arr)"/>
  <text class="edge-lbl" x="391" y="290">UPDATE / CLEAR</text>
  <!-- popup <-> background -->
  <path class="edge-dim" d="M505,396 L505,372" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
  <text class="edge-dim-lbl" x="412" y="388">GET_STATE</text>
  <!-- popup <-> storage -->
  <path class="edge-dim" d="M383,468 L383,492" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
  <text class="edge-dim-lbl" x="391" y="484">settings</text>

  <!-- background -> bridge -->
  <path class="edge" d="M518,334 L586,333" marker-end="url(#arr)"/>
  <text class="edge-lbl" x="522" y="324">ws :47201</text>
  <!-- bridge -> discord -->
  <path class="edge" d="M744,332 L796,332" marker-end="url(#arr)"/>
  <text class="edge-lbl" x="748" y="322">IPC · rpc</text>
  <!-- discord -> статус -->
  <path class="edge" d="M882,368 L882,392" marker-end="url(#arr)"/>
</svg>
<figcaption>Связи заданы в <code>manifest.json</code> (MV3): один content-скрипт на 4 домена, <code>background.js</code> — service worker, <code>popup</code> — только чтение состояния; content читает вкл/выкл сайтов из storage.</figcaption>
</figure>
</body>
</html>
